</style></defs>
<rect width="1200" height="1500" fill="#F4ECE0"/><rect x="34" y="34" width="1132" height="1432" rx="46" fill="none" stroke="#1B2E25" stroke-width="3"/>
<g fill="none" stroke="#4A6A4F" stroke-width="2" opacity=".15" stroke-linecap="round"><path d="M1000 112 C1026 119 1054 119 1083 111"/><path d="M92 1324 C119 1331 143 1330 166 1323"/><path d="M1015 1368 C1042 1363 1068 1364 1094 1372"/></g>
<text x="88" y="103" class="h ink" font-size="22" font-weight="700" letter-spacing="3.2">CONSTRUIRE ORÉE / EN PUBLIC</text><path d="M88 126 C290 122 458 138 630 131 C815 124 966 136 1110 127" fill="none" stroke="#E0A458" stroke-width="5" stroke-linecap="round"/>
<text x="88" y="176" class="h moss" font-size="20" font-weight="700" letter-spacing="2">QUESTION DE FRONTIÈRE</text>
<text x="88" y="226" class="h char" font-size="31"><tspan x="88">Le problème n’est pas de séparer</tspan><tspan x="88" dy="38">naïvement le « vrai » du « faux ».</tspan></text>
<text x="86" y="390" class="f ink" font-size="104" font-weight="700"><tspan x="86">Où s’arrête</tspan><tspan x="86" dy="108">le « fait main » ?</tspan></text>
<path d="M74 690 C170 642 258 652 350 699 C450 750 539 779 632 735 C730 687 802 608 894 622 C995 638 1034 716 1112 733" fill="none" stroke="#E0A458" stroke-width="28" stroke-linecap="round"/><path d="M75 690 C171 649 258 659 350 702 C449 748 539 775 632 736 C729 693 802 616 894 626 C995 641 1033 714 1112 731" fill="none" stroke="#F6D39F" stroke-width="8" stroke-linecap="round" opacity=".5"/>
<g transform="translate(503 605)"><path d="M18 0 C74 -11 355 -10 416 3 C443 9 447 55 416 70 C350 84 84 84 18 71 C-10 65 -8 8 18 0Z" fill="#1B2E25"/><text x="218" y="47" text-anchor="middle" class="h lin" font-size="29" font-weight="700">la frontière n’est pas simple</text></g>
<text x="82" y="804" class="h char" font-size="28" font-weight="500">Alors, qu’est-ce qui compte vraiment ?</text><text x="82" y="870" class="h ink" font-size="47" font-weight="700"><tspan x="82">L’outil ou le tiers ne suffisent pas,</tspan><tspan x="82" dy="55">à eux seuls, à trancher.</tspan></text>
<g fill="none" stroke="#1B2E25" stroke-width="3.5" stroke-linecap="round"><path d="M242 960 C223 986 204 1011 187 1046"/><path d="M604 962 C594 992 586 1017 581 1056"/><path d="M891 960 C908 990 925 1016 941 1047"/></g><g fill="#1B2E25"><circle cx="242" cy="960" r="6"/><circle cx="604" cy="962" r="6"/><circle cx="891" cy="960" r="6"/></g>
<g transform="translate(78 1075)"><path d="M20 8 C62 -4 293 -3 326 12 C344 21 347 45 346 82 C345 121 349 176 330 194 C305 216 58 211 26 198 C3 188 1 154 4 115 C7 79 -4 20 20 8Z" fill="#FFF9F2" stroke="#1B2E25" stroke-width="3"/><text x="24" y="35" class="m moss" font-size="15" font-weight="700">01 / CÉRAMIQUE</text><path d="M59 84 C64 125 87 147 120 147 C155 147 179 125 184 84 Z" fill="none" stroke="#C4724E" stroke-width="6"/><path d="M70 84 C94 76 147 76 173 84" fill="none" stroke="#C4724E" stroke-width="4.5" stroke-linecap="round"/><rect x="219" y="65" width="42" height="86" fill="none" stroke="#1B2E25" stroke-width="3"/><rect x="227" y="80" width="25" height="39" fill="#E0A458" opacity=".8" stroke="#1B2E25" stroke-width="2"/><text x="24" y="171" class="h ink" font-size="18" font-weight="700">Elle façonne.</text><text x="24" y="196" class="h char" font-size="17">La cuisson est confiée.</text></g>
<g transform="translate(432 1075)"><path d="M20 8 C62 -4 293 -3 326 12 C344 21 347 45 346 82 C345 121 349 176 330 194 C305 216 58 211 26 198 C3 188 1 154 4 115 C7 79 -4 20 20 8Z" fill="#FFF9F2" stroke="#1B2E25" stroke-width="3"/><text x="24" y="35" class="m moss" font-size="15" font-weight="700">02 / ILLUSTRATION</text><rect x="49" y="63" width="99" height="95" fill="none" stroke="#1B2E25" stroke-width="3"/><circle cx="76" cy="85" r="8" fill="#E0A458"/><path d="M64 137 C82 111 95 95 117 80 C128 98 136 113 141 138" fill="none" stroke="#C4724E" stroke-width="4.5" stroke-linecap="round"/><circle cx="230" cy="87" r="18" fill="none" stroke="#1B2E25" stroke-width="3"/><circle cx="230" cy="132" r="18" fill="none" stroke="#1B2E25" stroke-width="3"/><path d="M208 110 h44" stroke="#E0A458" stroke-width="5" stroke-linecap="round"/><text x="24" y="171" class="h ink" font-size="18" font-weight="700">Il crée l’image.</text><text x="24" y="196" class="h char" font-size="17">L’impression est déléguée.</text></g>
<g transform="translate(786 1075)"><path d="M20 8 C62 -4 293 -3 326 12 C344 21 347 45 346 82 C345 121 349 176 330 194 C305 216 58 211 26 198 C3 188 1 154 4 115 C7 79 -4 20 20 8Z" fill="#FFF9F2" stroke="#1B2E25" stroke-width="3"/><text x="24" y="35" class="m moss" font-size="15" font-weight="700">03 / CNC</text><path d="M59 134 C57 103 70 78 100 68 C126 60 147 69 155 90 C163 112 151 140 126 151 C102 162 64 159 59 134Z" fill="none" stroke="#C4724E" stroke-width="6"/><path d="M82 120 C95 108 112 97 135 86" fill="none" stroke="#4A6A4F" stroke-width="3.8" stroke-linecap="round"/><rect x="214" y="58" width="40" height="48" fill="none" stroke="#1B2E25" stroke-width="3"/><path d="M221 110 h26 l-6 22 h-14 z" fill="#E0A458" stroke="#1B2E25" stroke-width="2"/><path d="M234 132 v23" stroke="#1B2E25" stroke-width="3"/><text x="24" y="171" class="h ink" font-size="18" font-weight="700">Il conçoit la pièce.</text><text x="24" y="196" class="h char" font-size="17">La découpe est assistée.</text></g>
<g transform="translate(78 1370)"><path d="M17 0 H1024 C1044 0 1057 15 1053 35 L1049 60 C1046 80 1031 91 1008 91 H25 C5 91 -7 78 -4 56 L1 24 C4 8 10 0 17 0Z" fill="#1B2E25"/><circle cx="46" cy="45" r="11" fill="#E0A458"/><text x="77" y="38" class="h lin" font-size="21" font-weight="700">Orée n’a encore arrêté aucun critère.</text><text x="77" y="64" class="h lin" opacity=".9" font-size="18">On préfère d’abord éprouver les cas limites avant d’écrire la règle.</text></g>
</svg>