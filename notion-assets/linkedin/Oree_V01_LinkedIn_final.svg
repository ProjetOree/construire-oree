<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Orée — V01 LinkedIn — Où s’arrête le fait main ?</title>
<desc id="desc">Affiche éditoriale Orée sur la frontière du fait main avec trois cas : céramique, illustration et CNC.</desc>
<defs><style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap");
